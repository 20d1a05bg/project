apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
    spec:
      containers:
      - name: notes-app
        image: sanskriti3/notes-app:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: notes-app-service
spec:
  type: NodePort
  selector:
    app: notes-app
  ports:
  - port: 8081
    targetPort: 80 
    nodePort: 32000
